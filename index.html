<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#00A884">
  <title>WhatSend Pro</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7faf8}
    #root{min-height:100vh}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#071b15;color:#fff}
    .boot-card{width:min(520px,100%);padding:32px;border:1px solid #23443a;border-radius:20px;background:#0d2820;text-align:center;box-sizing:border-box}
    .boot-mark{width:48px;height:48px;margin:0 auto 16px;border-radius:14px;background:#00a884;display:grid;place-items:center;font-size:24px;font-weight:800}
    .boot h1{font-size:24px;margin:0 0 8px}.boot p{margin:0;color:#a9bcb5;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot-card">
        <div class="boot-mark">➤</div>
        <h1>WhatSend Pro</h1>
        <p>Chargement de votre espace professionnel…</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
